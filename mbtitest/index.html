<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>性格测试</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f5;
      --panel: #ffffff;
      --ink: #111111;
      --muted: #666666;
      --line: #d8d8d8;
      --accent: #111111;
      --accent-strong: #000000;
      --accent-soft: #f0f0f0;
      --warn: #333333;
      --shadow: 0 14px 32px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .hero {
      margin-bottom: 24px;
    }

    .intro,
    .quiz-panel {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(216, 216, 216, 0.9);
      box-shadow: var(--shadow);
    }

    .intro {
      min-height: 260px;
      padding: clamp(24px, 4vw, 42px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4.5vw, 4.8rem);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 680px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.8vw, 1.18rem);
      line-height: 1.75;
    }

    .quiz-panel {
      padding: 22px;
    }

    .action-bar {
      position: sticky;
      bottom: 0;
      z-index: 2;
      margin: 18px -22px -22px;
      padding: 16px 22px;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      background: rgba(255, 255, 255, 0.95);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .progress {
      color: var(--muted);
      line-height: 1.4;
    }

    .progress strong {
      color: var(--ink);
      font-size: 1.05rem;
    }

    .button {
      border: 1px solid transparent;
      min-height: 42px;
      padding: 0 16px;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
    }

    .button:hover,
    .button:focus-visible {
      background: var(--accent-strong);
    }

    .button.secondary {
      color: var(--accent-strong);
      background: #fff;
      border-color: var(--line);
    }

    .button.secondary:hover,
    .button.secondary:focus-visible {
      background: var(--accent-soft);
    }

    .question-list {
      display: grid;
      gap: 10px;
    }

    .question {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      min-height: 68px;
      padding: 16px;
      border: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
    }

    .question:hover {
      border-color: #111111;
      background: #fafafa;
    }

    .question input {
      width: 22px;
      height: 22px;
      margin: 1px 0 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .question span {
      line-height: 1.62;
    }

    .note {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .warning {
      color: var(--warn);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.48);
    }

    .modal[hidden] {
      display: none;
    }

    .modal-card {
      width: min(420px, 100%);
      padding: 30px;
      background: #ffffff;
      border: 1px solid #111111;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.24);
      text-align: center;
    }

    .modal-label {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .modal-type {
      margin: 16px 0 12px;
      font-size: clamp(3.2rem, 12vw, 5.5rem);
      line-height: 0.9;
      font-weight: 800;
      letter-spacing: 0;
    }

    .modal-copy {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.7;
    }

    @media (max-width: 820px) {
      .shell {
        width: min(100% - 24px, 720px);
        padding-top: 18px;
      }

      .action-bar {
        grid-template-columns: 1fr;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="intro">
        <h1 id="page-title">性格测试</h1>
        <p class="subtitle">
          提醒：请选择你内心本来的样子，而不是在某种压力下的状态。比如你本来就是不做计划的，但是在工作中有要求所以做了计划，那就是不做计划。
        </p>
      </div>

    </section>

    <section class="quiz-panel">
      <form id="quizForm" class="question-list"></form>

      <div class="action-bar">
        <div class="progress">
          已选择 <strong id="checkedCount">0</strong> / 40
        </div>
        <button class="button secondary" type="button" id="shuffleButton">重新选择</button>
        <button class="button" type="button" id="submitButton">提交</button>
      </div>
    </section>
  </main>

  <div class="modal" id="resultModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <p class="modal-label" id="modalTitle">你的测试结果</p>
      <div class="modal-type" id="modalType">----</div>
      <p class="modal-copy" id="modalCopy">最后你是 ----。</p>
      <button class="button" type="button" id="closeModalButton">知道了</button>
    </div>
  </div>

  <script>
    const questions = [
      { letter: "E", text: "注意力集中于外部环境，通过与外界的互动，包括交流、行动获取和处理信息。" },
      { letter: "S", text: "讲求实际，实事求是，关注信息中的相关事实与有趣的细节，然后才开始研究背后的模式或整体概念。" },
      { letter: "E", text: "不喜欢复杂的程序，难以长时间专注于一件事情，尤其在需要独立完成的时候。" },
      { letter: "P", text: "处事灵活，适应能力强；热衷于变换角色，不喜欢条条框框和例行公事。" },
      { letter: "N", text: "热衷于了解事实背后的含义，以及局部事实如何组合在一起形成整体；更多地将注意力集中在事实背后的隐喻、可能性及其中的关联，多于事实和数据本身。" },
      { letter: "P", text: "灵活应变，随机而变；在没有固定时间表的时候觉得最自如。" },
      { letter: "T", text: "希望自己和他人都能胜任工作；会发现具体工作的漏洞，并给出具有建设性的反馈。" },
      { letter: "J", text: "喜欢迅速做决定并尽快完成。" },
      { letter: "E", text: "与他人合作分享、讨论和处理信息时的学习和工作效率最佳。" },
      { letter: "F", text: "希望他人可以支持自己、鼓励自己，同时也会支持他人、鼓励他人；能够发现别人的长处，乐于给予积极正面的反馈。" },
      { letter: "S", text: "工作过程中喜欢以讲求事实并且井井有条的方式展示信息。" },
      { letter: "E", text: "在处理事情的时候，喜欢提出问题引发讨论；往往不假思索地回答别人提出的问题。" },
      { letter: "N", text: "喜欢在不同的想法和工作之间来回切换；可能会迸发出惊人的冲劲，但缺乏耐力。" },
      { letter: "P", text: "推迟决定，以便收集更多信息。" },
      { letter: "E", text: "乐于分享信息并与他人互动，善于表达自己，通常会让对方觉得很容易了解。" },
      { letter: "N", text: "更热衷于思考未来，了解“全局”。" },
      { letter: "T", text: "客观地考虑信息；评估其会对因果关系造成的影响，以及产生的最终结果。" },
      { letter: "I", text: "沉浸于自我内心世界，通过思考、自省吸收和消化外部信息。" },
      { letter: "F", text: "喜欢与同事结交朋友，乐于培养私人关系。" },
      { letter: "S", text: "非常有兴趣按照自己目前的了解、理解与应用事实。" },
      { letter: "J", text: "喜欢跟进并最终完成具体的工作与项目。" },
      { letter: "T", text: "将工作与私人关系分开来看；通常不会在工作中讨论个人问题，也不会发展亲密的私人关系。" },
      { letter: "N", text: "喜欢构思新想法，面对细节会觉得力不从心或者兴致全无。" },
      { letter: "F", text: "以人为本，注重合作，通过和谐氛围来实现高效的工作方式。" },
      { letter: "J", text: "喜欢事情按照计划有条不紊地进行，通常情况下遇到意料之外的变化会觉得不安。" },
      { letter: "I", text: "喜欢安静的工作环境，长时间专注于一项工作，不喜欢受到干扰。" },
      { letter: "I", text: "在有充足的时间自己去了解和处理相关信息时的学习和工作效率最佳。" },
      { letter: "T", text: "专注于目标和逻辑，注重通过高效的方式完成具体任务。" },
      { letter: "S", text: "喜欢按部就班的做好手头的工作。" },
      { letter: "J", text: "富有计划性，有条理；热衷于制定计划，安排自己的时间表。" },
      { letter: "I", text: "喜欢深思熟虑之后再回答别人的问题。" },
      { letter: "P", text: "喜欢变化，在不知道前面的道路、有不确定或意料之外的变动发生时感到最开心。" },
      { letter: "T", text: "强调对信息进行逻辑分析。" },
      { letter: "F", text: "做决策时更注重对人的影响和感受。" },
      { letter: "N", text: "喜欢构思想法或新理念，喜欢对于信息有一个整体性概念性的了解，而不仅停留在具体的细节上。" },
      { letter: "S", text: "面对需要长时间实现的抽象想法或未来的事情，可能会放弃，更倾向于关注实际和具体的任务。" },
      { letter: "F", text: "会以主观的方式考虑信息；评估其对牵扯的人产生何种影响或造成何种结果。" },
      { letter: "J", text: "喜欢设想预期结果，喜欢明确所有的角色和期望，对于条条框框具有高度的忍耐性。" },
      { letter: "I", text: "在分享信息或展开互动的时候会小心选择对象，为人安静，通常注重隐私。" },
      { letter: "P", text: "工作中喜欢不断探索新项目和新任务，在尝试多样化的工作时感到更有动力和热情，而不是一成不变的工作。" }
    ];

    const pairs = [["E", "I"], ["S", "N"], ["T", "F"], ["J", "P"]];
    const form = document.querySelector("#quizForm");
    const checkedCount = document.querySelector("#checkedCount");
    const submitButton = document.querySelector("#submitButton");
    const shuffleButton = document.querySelector("#shuffleButton");
    const resultModal = document.querySelector("#resultModal");
    const modalType = document.querySelector("#modalType");
    const modalCopy = document.querySelector("#modalCopy");
    const closeModalButton = document.querySelector("#closeModalButton");

    let currentQuestions = [];

    function shuffle(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
      }
      return copy;
    }

    function renderQuestions() {
      form.innerHTML = "";
      currentQuestions.forEach((question, index) => {
        const label = document.createElement("label");
        label.className = "question";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.name = "trait";
        input.value = question.letter;
        input.dataset.index = String(index);

        const text = document.createElement("span");
        text.textContent = `${index + 1}. ${question.text}`;

        label.append(input, text);
        form.append(label);
      });
      updateCheckedCount();
    }

    function countScores() {
      const scores = Object.fromEntries("EISNTFJP".split("").map((letter) => [letter, 0]));
      form.querySelectorAll("input:checked").forEach((input) => {
        scores[input.value] += 1;
      });
      return scores;
    }

    function chooseLetter(scores, left, right) {
      const leftScore = scores[left];
      const rightScore = scores[right];

      if (leftScore >= 3 && rightScore < 3) return left;
      if (rightScore >= 3 && leftScore < 3) return right;
      if (leftScore > rightScore) return left;
      if (rightScore > leftScore) return right;
      return "?";
    }

    function updateCheckedCount() {
      checkedCount.textContent = String(form.querySelectorAll("input:checked").length);
    }

    function showResult() {
      const scores = countScores();
      const type = pairs.map(([left, right]) => chooseLetter(scores, left, right)).join("");
      const uncertain = type.includes("?");

      modalType.textContent = type;
      modalCopy.textContent = uncertain
        ? "结果暂不明确，建议回看选项后再提交。"
        : `最后你是 ${type}。`;
      modalCopy.classList.toggle("warning", uncertain);
      resultModal.hidden = false;
    }

    function resetAndShuffle() {
      currentQuestions = shuffle(questions);
      renderQuestions();
      resultModal.hidden = true;
      modalCopy.classList.remove("warning");
    }

    form.addEventListener("change", updateCheckedCount);
    submitButton.addEventListener("click", showResult);
    shuffleButton.addEventListener("click", resetAndShuffle);
    closeModalButton.addEventListener("click", () => {
      resultModal.hidden = true;
    });
    resultModal.addEventListener("click", (event) => {
      if (event.target === resultModal) {
        resultModal.hidden = true;
      }
    });

    resetAndShuffle();
  </script>
</body>
</html>
