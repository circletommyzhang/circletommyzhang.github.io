<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>猎头版MBTI测试</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f5;
      --panel: #ffffff;
      --ink: #111111;
      --muted: #666666;
      --line: #d8d8d8;
      --accent: #111111;
      --accent-strong: #000000;
      --accent-soft: #f0f0f0;
      --warn: #333333;
      --shadow: 0 14px 32px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .hero {
      margin-bottom: 24px;
    }

    .intro,
    .quiz-panel {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(216, 216, 216, 0.9);
      box-shadow: var(--shadow);
    }

    .intro {
      min-height: 260px;
      padding: clamp(24px, 4vw, 42px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4.5vw, 4.8rem);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 680px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.8vw, 1.18rem);
      line-height: 1.75;
    }

    .lead {
      max-width: 680px;
      margin: 18px 0 0;
      color: var(--ink);
      font-size: clamp(1.05rem, 1.9vw, 1.28rem);
      line-height: 1.55;
      font-weight: 700;
    }

    .subtitle strong {
      color: var(--ink);
      font-weight: 800;
    }

    .subtitle ol {
      margin: 8px 0 0;
      padding-left: 1.35em;
    }

    .subtitle li + li {
      margin-top: 6px;
    }

    .quiz-panel {
      padding: 22px;
    }

    .action-bar {
      position: sticky;
      bottom: 0;
      z-index: 2;
      margin: 18px -22px -22px;
      padding: 16px 22px;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      background: rgba(255, 255, 255, 0.95);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .progress {
      color: var(--muted);
      line-height: 1.4;
    }

    .progress strong {
      color: var(--ink);
      font-size: 1.05rem;
    }

    .button {
      border: 1px solid transparent;
      min-height: 42px;
      padding: 0 16px;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
    }

    .button:hover,
    .button:focus-visible {
      background: var(--accent-strong);
    }

    .button.secondary {
      color: var(--accent-strong);
      background: #fff;
      border-color: var(--line);
    }

    .button.secondary:hover,
    .button.secondary:focus-visible {
      background: var(--accent-soft);
    }

    .question-list {
      display: grid;
      gap: 10px;
    }

    .question {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      min-height: 68px;
      padding: 16px;
      border: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
    }

    .question:hover {
      border-color: #111111;
      background: #fafafa;
    }

    .question input {
      width: 22px;
      height: 22px;
      margin: 1px 0 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .question span {
      line-height: 1.62;
    }

    .note {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .warning {
      color: var(--warn);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.48);
    }

    .modal[hidden] {
      display: none;
    }

    .modal-card {
      width: min(560px, 100%);
      max-height: calc(100vh - 40px);
      overflow: auto;
      padding: 30px;
      background: #ffffff;
      border: 1px solid #111111;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.24);
      text-align: left;
    }

    .modal-label {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
    }

    .modal-type {
      margin: 16px 0 12px;
      font-size: clamp(3.2rem, 12vw, 5.5rem);
      line-height: 0.9;
      font-weight: 800;
      letter-spacing: 0;
      text-align: center;
    }

    .modal-copy {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.7;
      text-align: center;
    }

    .modal-copy[hidden] {
      display: none;
    }

    .advice {
      display: grid;
      gap: 14px;
      margin: 20px 0 24px;
    }

    .advice-section h3 {
      margin: 0 0 6px;
      font-size: 1rem;
      line-height: 1.35;
    }

    .advice-section p {
      margin: 0;
      color: var(--muted);
      line-height: 1.75;
    }

    .modal-footer {
      display: grid;
      gap: 14px;
      align-items: start;
    }

    .learn-more {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .learn-more a {
      color: var(--ink);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    @media (max-width: 820px) {
      .shell {
        width: min(100% - 24px, 720px);
        padding-top: 18px;
      }

      .action-bar {
        grid-template-columns: 1fr;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="intro">
        <h1 id="page-title">猎头版MBTI测试</h1>
        <p class="lead">提交后会给你做猎头的建议</p>
        <div class="subtitle">
          <strong>提醒：</strong>
          <ol>
            <li>选择你内心本来的样子。比如：你是不喜欢做计划的，但是长期工作中必须做计划，你也经常做计划，那你选择时就应该选择你不做计划，你喜欢自由发挥。</li>
            <li>模棱两可的建议不选。</li>
          </ol>
        </div>
      </div>

    </section>

    <section class="quiz-panel">
      <form id="quizForm" class="question-list"></form>

      <div class="action-bar">
        <div class="progress">
          已选择 <strong id="checkedCount">0</strong> / 40
        </div>
        <button class="button secondary" type="button" id="shuffleButton">重新选择</button>
        <button class="button" type="button" id="submitButton">提交</button>
      </div>
    </section>
  </main>

  <div class="modal" id="resultModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <p class="modal-label" id="modalTitle">你的测试结果</p>
      <div class="modal-type" id="modalType">----</div>
      <p class="modal-copy" id="modalCopy">最后你是 ----。</p>
      <div class="advice" id="resultAdvice"></div>
      <div class="modal-footer">
        <button class="button" type="button" id="closeModalButton">知道了</button>
        <p class="learn-more">
          想学习更多猎头干货请点击：
          <a href="https://circle.feishu.cn/wiki/XJ6Xw6SXKiiojpkKhdecf43Ynzg" target="_blank" rel="noopener">公众号：《猎头张振》的干货目录</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const questions = [
      { letter: "E", text: "注意力集中于外部环境，通过与外界的互动，包括交流、行动获取和处理信息。" },
      { letter: "S", text: "讲求实际，实事求是，关注信息中的相关事实与有趣的细节，然后才开始研究背后的模式或整体概念。" },
      { letter: "E", text: "不喜欢复杂的程序，难以长时间专注于一件事情，尤其在需要独立完成的时候。" },
      { letter: "P", text: "处事灵活，适应能力强；热衷于变换角色，不喜欢条条框框和例行公事。" },
      { letter: "N", text: "热衷于了解事实背后的含义，以及局部事实如何组合在一起形成整体；更多地将注意力集中在事实背后的隐喻、可能性及其中的关联，多于事实和数据本身。" },
      { letter: "P", text: "灵活应变，随机而变；在没有固定时间表的时候觉得最自如。" },
      { letter: "T", text: "希望自己和他人都能胜任工作；会发现具体工作的漏洞，并给出具有建设性的反馈。" },
      { letter: "J", text: "喜欢迅速做决定并尽快完成。" },
      { letter: "E", text: "与他人合作分享、讨论和处理信息时的学习和工作效率最佳。" },
      { letter: "F", text: "希望他人可以支持自己、鼓励自己，同时也会支持他人、鼓励他人；能够发现别人的长处，乐于给予积极正面的反馈。" },
      { letter: "S", text: "工作过程中喜欢以讲求事实并且井井有条的方式展示信息。" },
      { letter: "E", text: "在处理事情的时候，喜欢提出问题引发讨论；往往不假思索地回答别人提出的问题。" },
      { letter: "N", text: "喜欢在不同的想法和工作之间来回切换；可能会迸发出惊人的冲劲，但缺乏耐力。" },
      { letter: "P", text: "推迟决定，以便收集更多信息。" },
      { letter: "E", text: "乐于分享信息并与他人互动，善于表达自己，通常会让对方觉得很容易了解。" },
      { letter: "N", text: "更热衷于思考未来，了解“全局”。" },
      { letter: "T", text: "客观地考虑信息；评估其会对因果关系造成的影响，以及产生的最终结果。" },
      { letter: "I", text: "沉浸于自我内心世界，通过思考、自省吸收和消化外部信息。" },
      { letter: "F", text: "喜欢与同事结交朋友，乐于培养私人关系。" },
      { letter: "S", text: "非常有兴趣按照自己目前的了解、理解与应用事实。" },
      { letter: "J", text: "喜欢跟进并最终完成具体的工作与项目。" },
      { letter: "T", text: "将工作与私人关系分开来看；通常不会在工作中讨论个人问题，也不会发展亲密的私人关系。" },
      { letter: "N", text: "喜欢构思新想法，面对细节会觉得力不从心或者兴致全无。" },
      { letter: "F", text: "以人为本，注重合作，通过和谐氛围来实现高效的工作方式。" },
      { letter: "J", text: "喜欢事情按照计划有条不紊地进行，通常情况下遇到意料之外的变化会觉得不安。" },
      { letter: "I", text: "喜欢安静的工作环境，长时间专注于一项工作，不喜欢受到干扰。" },
      { letter: "I", text: "在有充足的时间自己去了解和处理相关信息时的学习和工作效率最佳。" },
      { letter: "T", text: "专注于目标和逻辑，注重通过高效的方式完成具体任务。" },
      { letter: "S", text: "喜欢按部就班的做好手头的工作。" },
      { letter: "J", text: "富有计划性，有条理；热衷于制定计划，安排自己的时间表。" },
      { letter: "I", text: "喜欢深思熟虑之后再回答别人的问题。" },
      { letter: "P", text: "喜欢变化，在不知道前面的道路、有不确定或意料之外的变动发生时感到最开心。" },
      { letter: "T", text: "强调对信息进行逻辑分析。" },
      { letter: "F", text: "做决策时更注重对人的影响和感受。" },
      { letter: "N", text: "喜欢构思想法或新理念，喜欢对于信息有一个整体性概念性的了解，而不仅停留在具体的细节上。" },
      { letter: "S", text: "面对需要长时间实现的抽象想法或未来的事情，可能会放弃，更倾向于关注实际和具体的任务。" },
      { letter: "F", text: "会以主观的方式考虑信息；评估其对牵扯的人产生何种影响或造成何种结果。" },
      { letter: "J", text: "喜欢设想预期结果，喜欢明确所有的角色和期望，对于条条框框具有高度的忍耐性。" },
      { letter: "I", text: "在分享信息或展开互动的时候会小心选择对象，为人安静，通常注重隐私。" },
      { letter: "P", text: "工作中喜欢不断探索新项目和新任务，在尝试多样化的工作时感到更有动力和热情，而不是一成不变的工作。" }
    ];

    const resultAdvice = {
      ISTJ: {
        strengths: "你做事稳、细、可靠，适合做候选人信息核实、流程跟进、背景判断和长期人才库维护。你不容易被情绪带偏，也能发现简历和沟通中的细节问题。",
        cautions: "你需要特别注意，不要过早用经验判断人。候选人的动机、潜力和真实顾虑，有时不在表面信息里。如果只看履历和规则，可能会错过真正值得挖的人。",
        training: "你可能需要训练开放式提问和影响力表达。沟通时先听完整，再下判断；推荐前除了写清事实，也要写清候选人的痛点、机会吸引点和长期可能性。"
      },
      ISFJ: {
        strengths: "你有耐心、责任感强，容易让候选人感到被尊重。做猎头时，你适合做深度跟进、候选人维护、入职前后关怀和细节型交付。",
        cautions: "你需要特别注意，不要为了照顾对方感受而回避关键问题。薪资、离职原因、家庭阻力、竞业风险这些问题如果不早问，后面会变成更大的风险。",
        training: "你可能需要训练边界感和关键问题追问。关心候选人是优势，但每次沟通都要把事实问透，把风险写明，不要只做让人舒服的沟通。"
      },
      INFJ: {
        strengths: "你擅长理解人的深层动机，也能看到一个选择对候选人长期发展的影响。做猎头时，你适合做职业决策咨询、复杂候选人沟通和高信任关系维护。",
        cautions: "你需要特别注意，不要过度替候选人解释或承担。你看到的可能性未必就是对方会采取的行动，候选人的真实意愿仍然需要事实验证。",
        training: "你可能需要训练把洞察落到具体证据上。每次判断一个人，都要问：他说过什么、做过什么、放弃过什么、真正愿意承担什么成本。"
      },
      INTJ: {
        strengths: "你擅长看结构、看趋势、看关键变量。做猎头时，你适合做行业研究、客户判断、岗位画像拆解和高端人才策略分析。",
        cautions: "你需要特别注意，不要因为判断太快而忽略人的感受。候选人不是只按逻辑行动，客户也不是只按最优解决策，关系和情绪会影响结果。",
        training: "你可能需要训练欣赏式沟通。保留你的判断力，但表达时先让对方感到被理解，再指出问题；否则你的建议正确，也可能让人不愿意接受。"
      },
      ISTP: {
        strengths: "你冷静、务实，擅长从复杂信息里抓关键问题。做猎头时，你适合做简历筛选、能力判断、薪资结构分析和具体问题拆解。",
        cautions: "你需要特别注意，不要过于低估关系经营。猎头不是只判断对错，还要让候选人愿意继续聊、愿意信任你、愿意在关键时刻告诉你真实想法。",
        training: "你可能需要训练主动沟通和持续跟进。不要等问题出现才处理，重要候选人要定期维护，关键节点要提前确认动机、顾虑和风险。"
      },
      ISFP: {
        strengths: "你敏感、细腻，能感知候选人的真实状态，也不容易用强势方式压迫别人。做猎头时，你适合做一对一深聊、候选人关系维护和体验型服务。",
        cautions: "你需要特别注意，不要因为怕打扰、怕冲突而不推进。猎头工作需要在合适的时候追问、确认和推动，否则机会会被拖散。",
        training: "你可能需要训练表达自己的判断。你看见的问题要说出来，尤其是候选人的犹豫、客户的风险、offer 的不确定性，不要只放在心里。"
      },
      INFP: {
        strengths: "你重视人的价值和长期发展，容易从候选人的故事里看见真正的动机。做猎头时，你适合做职业选择沟通、内容表达和深度候选人经营。",
        cautions: "你需要特别注意，不要把理想化代入工作。候选人是否合适，不能只看价值观和潜力，还要看岗位要求、业务阶段、薪资边界和行动意愿。",
        training: "你可能需要训练现实校验。每次推荐前，把你的感觉翻译成事实：能力证据是什么？痛点是什么？风险是什么？客户为什么应该见他？"
      },
      INTP: {
        strengths: "你擅长分析原理和建立模型，适合做行业逻辑、岗位能力模型、人才地图和复杂问题拆解。你能看到别人忽略的底层结构。",
        cautions: "你需要特别注意，不要只停留在分析里。猎头工作的结果来自行动：联系、提问、推进、谈判、复盘。想清楚很重要，但不能替代执行。",
        training: "你可能需要训练简洁表达和行动节奏。和候选人沟通时少讲完整理论，多给清晰判断；每天固定推进关键人选，不要无限优化方案。"
      },
      ESTP: {
        strengths: "你反应快、敢行动，擅长现场判断和快速推进。做猎头时，你适合做 BD、陌生候选人切入、谈判推进和突发问题处理。",
        cautions: "你需要特别注意，不要只靠临场发挥。猎头的很多风险来自前期没问透：动机、薪资、家庭、竞业、客户顾虑，如果漏掉，后面会很被动。",
        training: "你可能需要训练记录和复盘。每次沟通后写下事实、判断和下一步动作；不要只凭感觉推进，关键节点必须留痕和确认。"
      },
      ESFP: {
        strengths: "你亲和、热情，容易让候选人愿意聊，也擅长活跃关系。做猎头时，你适合做候选人初步沟通、关系破冰、转介绍和机会介绍。",
        cautions: "你需要特别注意，不要为了气氛好而回避深问题。候选人开心不代表会行动，关系热络不代表岗位匹配，最后还是要回到事实和痛点。",
        training: "你可能需要训练深度提问。每次沟通都要问出真实动机、当前不满、决策标准和底线条件，让热情变成推动结果的能力。"
      },
      ENFP: {
        strengths: "你擅长和人建立连接，容易让候选人放下防备，也能看到一个人未来的可能性。做猎头时，你适合做候选人沟通、机会激发、转介绍和关系维护。",
        cautions: "你需要特别注意，不要只共情候选人。猎头不能因为喜欢一个人、理解一个人，就忽略岗位匹配、客户要求、薪资边界和离职风险。",
        training: "你可能需要训练结构化提问和事实核查。每次推荐前问自己三件事：他为什么匹配？他的真实痛点是什么？客户见他可能会担心什么？"
      },
      ENTP: {
        strengths: "你脑子快、点子多，擅长打开局面和找到新路径。做猎头时，你适合做新客户开拓、复杂岗位破局、人才地图创新和谈判策略设计。",
        cautions: "你需要特别注意，不要因为喜欢新机会就频繁换方向。猎头真正出业绩，靠的不只是聪明和创意，还靠持续跟进和把一个单子做到底。",
        training: "你可能需要训练收尾能力。每个项目都要明确目标公司、目标人选、推进节奏和复盘标准，少开新坑，多完成关键闭环。"
      },
      ESTJ: {
        strengths: "你目标感强、执行力好，擅长管理流程和推动结果。做猎头时，你适合做项目管理、客户交付、节点推进和团队执行标准建设。",
        cautions: "你需要特别注意，不要把人当流程管理。候选人的犹豫、客户的反复、offer 的变化，很多不是靠命令解决，而是靠理解真实原因。",
        training: "你可能需要训练倾听和弹性沟通。推进之前先问清对方为什么卡住，再给方案；不要只催进度，要解决阻力。"
      },
      ESFJ: {
        strengths: "你重视关系和服务体验，擅长让候选人和客户感到被照顾。做猎头时，你适合做候选人维护、客户服务、流程协调和入职跟进。",
        cautions: "你需要特别注意，不要为了维持和谐而不说难听的话。候选人不匹配、客户要求不合理、offer 有风险时，你必须及时指出来。",
        training: "你可能需要训练客观判断和拒绝能力。关系要维护，但标准不能降低；每次推荐都要用事实证明，而不是只凭对人的好感。"
      },
      ENFJ: {
        strengths: "你擅长影响人、组织共识，也能把机会讲得有方向感。做猎头时，你适合做高意愿候选人推动、客户沟通、offer 谈判和团队带教。",
        cautions: "你需要特别注意，不要过度替别人规划。候选人是否行动，要看他的真实痛点和成本承受力，不是你觉得这个机会对他好就够了。",
        training: "你可能需要训练事实边界。影响别人之前，先确认事实、风险和底线；你的表达力很强，更要确保每一句建议都有依据。"
      },
      ENTJ: {
        strengths: "你有战略感和推进力，适合做大客户开发、复杂项目统筹、关键岗位攻坚和团队目标管理。你能把混乱问题快速拆成可执行动作。",
        cautions: "你需要特别注意，不要只追求效率和结果。猎头面对的是人，候选人的信任、客户的犹豫和团队的状态，都不是单靠强推动解决的。",
        training: "你可能需要训练耐心和人情味。关键沟通前先听对方的顾虑，再给判断；强势可以推动进度，但理解才能降低风险。"
      }
    };

    const pairs = [["E", "I"], ["S", "N"], ["T", "F"], ["J", "P"]];
    const form = document.querySelector("#quizForm");
    const checkedCount = document.querySelector("#checkedCount");
    const submitButton = document.querySelector("#submitButton");
    const shuffleButton = document.querySelector("#shuffleButton");
    const resultModal = document.querySelector("#resultModal");
    const modalType = document.querySelector("#modalType");
    const modalCopy = document.querySelector("#modalCopy");
    const resultAdviceEl = document.querySelector("#resultAdvice");
    const closeModalButton = document.querySelector("#closeModalButton");

    let currentQuestions = [];

    function shuffle(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
      }
      return copy;
    }

    function renderQuestions() {
      form.innerHTML = "";
      currentQuestions.forEach((question, index) => {
        const label = document.createElement("label");
        label.className = "question";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.name = "trait";
        input.value = question.letter;
        input.dataset.index = String(index);

        const text = document.createElement("span");
        text.textContent = `${index + 1}. ${question.text}`;

        label.append(input, text);
        form.append(label);
      });
      updateCheckedCount();
    }

    function countScores() {
      const scores = Object.fromEntries("EISNTFJP".split("").map((letter) => [letter, 0]));
      form.querySelectorAll("input:checked").forEach((input) => {
        scores[input.value] += 1;
      });
      return scores;
    }

    function chooseLetter(scores, left, right) {
      const leftScore = scores[left];
      const rightScore = scores[right];

      if (leftScore > rightScore) return left;
      if (rightScore > leftScore) return right;
      return "?";
    }

    function updateCheckedCount() {
      checkedCount.textContent = String(form.querySelectorAll("input:checked").length);
    }

    function renderAdvice(type) {
      const advice = resultAdvice[type];
      resultAdviceEl.innerHTML = "";
      if (!advice) return;

      [
        ["你的优势：", advice.strengths],
        ["你需要特别注意：", advice.cautions],
        ["你可能需要训练：", advice.training]
      ].forEach(([title, text]) => {
        const section = document.createElement("section");
        section.className = "advice-section";

        const heading = document.createElement("h3");
        heading.textContent = title;

        const paragraph = document.createElement("p");
        paragraph.textContent = text;

        section.append(heading, paragraph);
        resultAdviceEl.append(section);
      });
    }

    function showResult() {
      const scores = countScores();
      const letters = pairs.map(([left, right]) => chooseLetter(scores, left, right));
      const type = letters.join("");
      const uncertain = type.includes("?");
      const uncertainPairs = pairs
        .filter((_, index) => letters[index] === "?")
        .map(([left, right]) => {
          if (left === "S" && right === "N") return "N 和 S";
          return `${left} 和 ${right}`;
        });

      modalType.textContent = type;
      modalCopy.textContent = uncertain
        ? `你在 ${uncertainPairs.join("、")} 维度上结果数据打平了，需要重新答题。`
        : "";
      modalCopy.hidden = !uncertain;
      modalCopy.classList.toggle("warning", uncertain);
      resultAdviceEl.innerHTML = "";
      if (!uncertain) {
        renderAdvice(type);
      }
      resultModal.hidden = false;
    }

    function resetAndShuffle() {
      currentQuestions = shuffle(questions);
      renderQuestions();
      resultModal.hidden = true;
      modalCopy.hidden = true;
      modalCopy.classList.remove("warning");
      resultAdviceEl.innerHTML = "";
    }

    form.addEventListener("change", updateCheckedCount);
    submitButton.addEventListener("click", showResult);
    shuffleButton.addEventListener("click", resetAndShuffle);
    closeModalButton.addEventListener("click", () => {
      resultModal.hidden = true;
    });
    resultModal.addEventListener("click", (event) => {
      if (event.target === resultModal) {
        resultModal.hidden = true;
      }
    });

    resetAndShuffle();
  </script>
</body>
</html>
